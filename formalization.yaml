# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: B. C. Carlson's approach to special functions of applied mathematics
  description: >-
    Lean formalization of selected results in B. C. Carlson's theory of special
    functions as complex Dirichlet averages. The registry selection establishes
    joint entire-parameter continuation of holomorphic averages on convex open
    scalar domains; joint holomorphy and native-integral agreement for the
    Gamma-regularized R and L functions on principal slit-node domains; Euler
    inversion and Euler-Poisson equations; and Gamma-regularized adaptations of
    both quadratic R transformations for all complex exponent and Dirichlet
    parameters with positive-real-part unsquared variables. The L function is
    related to R by exponent differentiation. The repository also supplies
    Pochhammer, several-complex-variable, simplex-integration, and Dirichlet
    foundations, which are not separately selected registry claims. This is a
    snapshot of an ongoing development, not complete coverage of Carlson's
    1977 book or 1987 L-function article.
  authors:
    - Bastiaan J Braams
  responsible_maintainers:
    - Bastiaan J Braams
  license: Apache-2.0

sources:
  - title: Special Functions of Applied Mathematics
    authors: [B. C. Carlson]
    type: book
    id: Academic Press, 1977
    relationship: formalizes
    location: Chapter 6, especially 6.3-6 and Section 6.8; supporting results from Chapters 3–5
    note: >-
      The selected nonquadratic book results concern general average continuation,
      R-function joint holomorphy, native agreement, Euler inversion, and
      Euler-Poisson equations. The functions use Gamma regularization and the
      proofs sometimes use different analytic constructions. The quadratic
      adaptations are recorded separately below. Other book material in the
      repository, including Sections 8.3–8.5, is not independently selected here.
  - title: Special Functions of Applied Mathematics
    authors: [B. C. Carlson]
    type: book
    id: Academic Press, 1977
    relationship: adapts
    location: Transformation 6.9-3, p. 161; Transformation 6.10-1, pp. 164–166; Section 6.8
    note: >-
      Formalizes Carlson's quadratic transformations 6.9-3 and 6.10-1 in
      Gamma-regularized form. The node assumptions agree with Carlson's: the
      unsquared variables have positive real parts, while squared and transformed
      arguments use the principal slit-plane branch. Regularization permits
      statements for all complex exponent and Dirichlet parameters. No enlargement
      of Carlson's node domain or mathematical novelty is claimed.
  - title: Dirichlet averages of x^t log x
    authors: [B. C. Carlson]
    type: paper
    id: SIAM Journal on Mathematical Analysis 18 (1987), 550–565
    relationship: formalizes
    location: Selected results from Sections 2–8
    note: >-
      The registry selection states joint holomorphy, native-integral agreement,
      and the exponent derivative defining L. The rest of the article is not
      advertised as fully formalized.
  - title: Lecture notes on several complex variables
    authors: [Harold P. Boas]
    type: other
    id: Lecture notes, 2013
    relationship: adapts
    location: Chapters 1–2
    note: >-
      The supporting SCV library uses Mathlib's differentiability and analyticity
      predicates, including complete complex normed codomains where proved.
      Osgood's continuity hypothesis is retained; unrestricted Hartogs is not claimed.
      These foundational results remain in the repository and the Lean wrappers
      but are not separately selected in comparator.json.
  - title: "Continuous Multivariate Distributions, Volume 1: Models and Applications"
    authors: [Samuel Kotz, N. Balakrishnan, Norman L. Johnson]
    type: book
    id: Wiley, 2000; DOI 10.1002/0471722065
    relationship: formalizes
    note: >-
      Real Dirichlet normalization, mixed moments, and aggregation in the
      supporting library. These remain part of the source snapshot, not
      separately selected registry claims.

classification:
  arxiv: [math.CA, math.CV]
  msc2020: ["33C65", "32A05"]

status:
  scope: >-
    All five mathematical libraries are included in the proof-side imports.
    Comparator selects 10 Carlson/Dirichlet-average continuation theorems and
    one R-function construction. Statement.lean and Solution.lean retain their
    21 theorem declarations unchanged; the other 11 are supporting material,
    not separately submitted claims. Their presence does not assert that they
    are already available in Mathlib. comparator.json specifies the selection;
    the README explains its mathematical scope and research interest.
  # Intentional Challenge placeholders are excluded from these counts.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]

automation:
  methods:
    - method: agent
      framework: Codex
  notes: >-
    Human-directed, agent-assisted mathematical development, proof writing,
    debugging, and review using Codex and Lean validation. Historical model
    versions and per-session costs are not reconstructed here. The metadata
    does not claim an independent human peer review.

fidelity:
  divergences: >-
    The ambient measure is coordinate Lebesgue measure on the entire sum-one
    hyperplane, restricted only when integrating over the simplex. R and L
    are Gamma-regularized and use principal branches. Native agreement on
    slit nodes requires the whole node convex hull to avoid the cut.
    Quadratic formulas retain Carlson's positive-real-part unsquared variables,
    allowing slit-plane squared and transformed nodes as in his stated formulas.
    They are adaptations to Gamma regularization with no exclusions on t or beta,
    not claims that ordinary R is finite at all parameter poles.
    Probability normalization and natural mixed moments exclude the empty
    index type. General nonconvex simply connected continuation, multiply
    connected and Riemann-surface extensions, and contour formula 6.8-7 remain open.

review:
  status: agent-reviewed
  notes: >-
    Lean builds and declaration axiom audits have been used during development.
    The maintainer reports that Palomar mechanical verification succeeded for
    the preceding submission with the same Lean declarations. Its automated
    editorial review declined registration because the separate foundational
    selections lacked a research-interest account and the quadratic adaptations
    needed clearer provenance. This revision narrows the Comparator selection
    and revises the documentation without changing any Lean file. External
    verification and editorial review of this revised snapshot remain pending;
    no independent human peer review or registration is claimed.
