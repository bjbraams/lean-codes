name = "Main"
version = "0.2.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-codes"

[[lean_lib]]
name = "Main"
roots = ["ToMathlib.Algebra", "ToMathlib.Analysis", "ToMathlib.Topology", "Dirichlet", "Carlson", "StdSimplexMeasure", "Pochhammer", "SeveralComplexVariables", "ComplexAnalysis"]
globs = [
  "ToMathlib.+",
  "StdSimplexMeasure", "StdSimplexMeasure.+",
  "Dirichlet", "Dirichlet.+",
  "Carlson", "Carlson.+",
  "Pochhammer", "Pochhammer.+",
  "SeveralComplexVariables", "SeveralComplexVariables.+",
  "ComplexAnalysis", "ComplexAnalysis.+",
]

[[lean_exe]]
name = "main"
root = "Main"

[[lean_lib]]
name = "Statement"

[[lean_lib]]
name = "Solution"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.35.0-rc2"
