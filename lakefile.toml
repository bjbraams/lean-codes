name = "Main"
version = "0.1.0"
defaultTargets = ["Main"]

[[lean_lib]]
name = "Main"
roots = ["Algebra", "Dirichlet", "Carlson", "StdSimplexMeasure", "Pochhammer", "SeveralComplexVariables", "ComplexAnalysis", "Analysis", "Topology"]
globs = [
  "Algebra", "Algebra.+",
  "StdSimplexMeasure", "StdSimplexMeasure.+",
  "Dirichlet", "Dirichlet.+",
  "Carlson", "Carlson.+",
  "Pochhammer", "Pochhammer.+",
  "SeveralComplexVariables", "SeveralComplexVariables.+",
  "ComplexAnalysis", "ComplexAnalysis.+",
  "Analysis", "Analysis.+",
  "Topology", "Topology.+",
]

[[lean_exe]]
name = "main"
root = "Main"

[[lean_lib]]
name = "Statement"

[[lean_lib]]
name = "Solution"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.35.0-rc2"
