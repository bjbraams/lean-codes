name = "Main"
version = "0.2.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-codes"

[[lean_lib]]
name = "Main"
roots = ["ToMathlib.Algebra", "ToMathlib.Analysis", "ToMathlib.Topology", "Dirichlet", "SimplexMellin", "Carlson", "StdSimplexMeasure", "Pochhammer", "SeveralComplexVariables", "ComplexAnalysis"]
globs = [
  "ToMathlib.+",
  "StdSimplexMeasure", "StdSimplexMeasure.+",
  "Dirichlet", "Dirichlet.+",
  "SimplexMellin", "SimplexMellin.+",
  "Carlson", "Carlson.+",
  "Pochhammer", "Pochhammer.+",
  "SeveralComplexVariables", "SeveralComplexVariables.+",
  "ComplexAnalysis", "ComplexAnalysis.+",
]

[[lean_exe]]
name = "main"
root = "Main"

[[lean_lib]]
name = "Statement"

[[lean_lib]]
name = "Solution"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# rc3 theorem sources, with dependency updates matching TauCeti a780c7ad6beb.
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.35.0-rc3"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "a780c7ad6beb23f60a17351a492d177878020ad5"
